name: Build Axiom Endgame

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repo
      - uses: actions/checkout@v4

      # 2. Set up Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Give gradlew permission
      - run: chmod +x ./gradlew

      # 4. Clean previous builds
      - run: ./gradlew clean

      # 5. Build the mod using Fabric Loom
      - run: ./gradlew build --no-daemon

      # 6. Debug: list contents of build/libs
      - run: ls -l build/libs

      # 7. Upload the jar artifact
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-endgame
          path: build/libs/*.jar
