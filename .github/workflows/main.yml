name: Build Axiom Endgame

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v4

      # Use Java 21 for Fabric Loom 1.14+
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Make gradlew executable
      - run: chmod +x gradlew

      # Clean previous builds
      - run: ./gradlew clean

      # Build mod
      - run: ./gradlew build --no-daemon

      # List files in build/libs (debug)
      - run: ls -l build/libs

      # Upload the jar
      - uses: actions/upload-artifact@v4
        with:
          name: axiom-endgame
          path: build/libs/*.jar
